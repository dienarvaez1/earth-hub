[project]
name = "earth-hub"
version = "0.1.0"
description = "Local-first earthquake data platform: USGS → Kafka → PostgreSQL → REST API"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.0",
    "boto3>=1.43.114",
    "confluent-kafka>=2.16.0",
    "duckdb>=1.5.6",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Long tracebacks print function arguments, which can include connection passwords.
addopts = "--tb=short"
markers = [
    "integration: needs the Docker Compose infrastructure running (make up)",
    "e2e: whole pipeline, feed to API, on temporary topics and databases (needs make up)",
    "disruptive: stops and starts shared containers; runs only with --run-disruptive",
    "performance: a full year of synthetic data; runs only with --run-performance",
    "dashboard: the dashboard served by wrangler dev in a browser (needs make dashboard-install)",
    "req(*ids): requirements from docs/progress/requirements.md that this test verifies",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "locust==2.46.7",
    "moto[s3]>=5.2.4",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-playwright>=0.10.0",
    "pytz>=2026.5",
    "pyyaml>=6.0.3",
    "ruff>=0.17.1",
    "schemathesis>=4.31.1",
]
