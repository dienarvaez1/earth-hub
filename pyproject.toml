[project]
name = "earth-hub"
version = "0.1.0"
description = "Local-first earthquake data platform: USGS → Kafka → PostgreSQL → REST API"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.0",
    "boto3>=1.43.114",
    "confluent-kafka>=2.16.0",
    "duckdb>=1.5.6",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# C90: complexity; S: security (Bandit's rules); SIM: simplifications; PL: Pylint's.
select = ["E", "F", "I", "B", "UP", "C90", "S", "SIM", "PL"]
ignore = [
    "PLC0415",  # imports inside functions: on purpose, so commands start without loading what they don't use
    "PLR0913",  # many arguments: keyword-only settings and test fixtures, by design
    "PLR0917",  # many positional arguments: the same
    "S603",     # subprocess without a shell: the safe form, with fixed argument lists
    "S607",     # subprocess by name (git, uv, npx, docker): found on PATH, as a developer runs them
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, compare with literal values, use made-up passwords and random streams, and
# query their own temporary databases and files with SQL built from fixed parts.
"tests/**" = ["S101", "PLR2004", "S105", "S106", "S108", "S311", "S608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Long tracebacks print function arguments, which can include connection passwords.
addopts = "--tb=short"
markers = [
    "integration: needs the Docker Compose infrastructure running (make up)",
    "e2e: whole pipeline, feed to API, on temporary topics and databases (needs make up)",
    "disruptive: stops and starts shared containers; runs only with --run-disruptive",
    "performance: a full year of synthetic data; runs only with --run-performance",
    "dashboard: the dashboard served by wrangler dev in a browser (needs make dashboard-install)",
    "req(*ids): requirements from docs/progress/requirements.md that this test verifies",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "locust==2.46.7",
    "moto[s3]>=5.2.4",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-playwright>=0.10.0",
    "pytz>=2026.5",
    "pyyaml>=6.0.3",
    "ruff>=0.17.1",
    "schemathesis>=4.31.1",
]
