# Direct mode on a schedule (docs/technical/ci.md#direct-mode-on-a-schedule): USGS straight to
# R2 with no machine of ours running.
#
# round      every hour, started by the dashboard Worker's cron trigger (dashboard/src/worker.ts:
#            GitHub's own schedule fired late or not at all, DEF-052), or by hand: one poller
#            round, and catch-up if due (make direct-once)
# token      once a day, when the trigger passes the days its GitHub token has left: fails within
#            14 days, so GitHub e-mails the token's owner to run make trigger-token. No secrets.
# reconcile  every day at 05:41 UTC, started by the same Worker's other cron trigger, or by
#            hand: direct mode's bucket invariants (make reconcile-direct; on Sundays with
#            DEEP=1, reading every row object, DEF-058), then the bucket against USGS (make
#            reconcile-usgs), failing if no round has written for 2 hours (a failed run
#            e-mails). Read-only.
#
# No schedule of its own: GitHub disables a public repository's scheduled workflows after
# 60 days without commits, and the rounds with them (DEF-056). watchdog.yml holds the one
# schedule, and fails when the Worker has started no run here for 2 hours.
#
# Both skip (exit 0) while the bucket is not in direct mode: `make mode-full` pauses the
# schedule, `make mode-direct` resumes it. Only one direct process should write: stop any
# `make direct-run` elsewhere while this schedule is on.
#
# The only workflow with secrets: R2 credentials, in the `r2` environment, which only `main`
# can use, given only to the step that needs them. No pull_request or push trigger, and pull
# requests from forks never get secrets. Actions are pinned to commit SHAs (the tag is in the
# comment); the token is read-only.

name: Direct mode

on:
  workflow_dispatch:
    inputs:
      job:
        description: What to run
        type: choice
        options: [round, reconcile]
        default: round
      token_days_left:
        description: Days until the trigger's GitHub token expires (the trigger sets it once a day)
        type: string
        default: ""
      started_by:
        description: Who asks for the run, for its audit record (the trigger sets cloudflare-trigger)
        type: string
        default: ""

permissions:
  contents: read

# One at a time, and never cancelled halfway: a round's redo record would finish it, but the
# lock would hold the next one back for up to 15 minutes.
concurrency:
  group: direct-mode
  cancel-in-progress: false

env:
  UV_PYTHON_DOWNLOADS: automatic
  # Catch-up about every hour, and the deleted-events check every day: due a little early, as
  # rounds start a little unevenly; the first round after that runs them.
  CATCHUP_INTERVAL_SECONDS: "3000"
  DELETED_CHECK_INTERVAL_SECONDS: "82800"

jobs:
  round:
    name: Direct round
    if: inputs.job == 'round'
    environment: r2
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Configure from the example settings
        run: cp .env.example .env
      - run: make install
      - name: Direct round
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          USGS_CONTACT: ${{ vars.USGS_CONTACT }}
          EARTH_HUB_STARTED_BY: ${{ inputs.started_by }} # the audit record's started_by
        run: |
          set -o pipefail
          uv run python -m earth_hub.direct once --skip-unless-direct | tee output.txt
      - name: Summary on the run page
        if: always()
        # The lines that are not JSON log records: the command's own summary.
        run: grep -v '^{' output.txt >> "$GITHUB_STEP_SUMMARY" || echo "no summary written" >> "$GITHUB_STEP_SUMMARY"

  reconcile:
    name: Direct reconcile
    if: inputs.job == 'reconcile'
    environment: r2
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Configure from the example settings
        run: cp .env.example .env
      - run: make install
      - name: Reconcile
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          USGS_CONTACT: ${{ vars.USGS_CONTACT }}
        run: |
          set -o pipefail
          status=0
          # Weekly, every row object read: ~115k reads, within R2's budget (REQ-MODE-007).
          deep=""
          if [ "$(date -u +%u)" = 7 ]; then deep="--deep"; fi
          uv run python -m earth_hub.direct.reconcile --skip-unless-direct $deep \
            | tee output.txt || status=1
          uv run python -m earth_hub.usgs_reconcile --skip-unless-direct --max-age-hours 2 \
            | tee -a output.txt || status=1
          exit $status
      - name: Summary on the run page
        if: always()
        # The lines that are not JSON log records: the command's own summary.
        run: grep -v '^{' output.txt >> "$GITHUB_STEP_SUMMARY" || echo "no summary written" >> "$GITHUB_STEP_SUMMARY"

  token:
    name: Trigger token
    if: inputs.token_days_left != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Days until the trigger's token expires
        env:
          DAYS_LEFT: ${{ inputs.token_days_left }}
        run: |
          case "$DAYS_LEFT" in
            # Not echoed back: an input could carry workflow commands.
            '' | *[!0-9-]* | ?*-*) echo "::error::token_days_left is not a number of days"; exit 1 ;;
          esac
          if [ "$DAYS_LEFT" -le 14 ]; then
            echo "::error title=Renew the trigger's token::The dashboard trigger's GitHub token expires in $DAYS_LEFT days: run make trigger-token (docs/technical/ci.md#the-trigger)."
            exit 1
          fi
          echo "The trigger's GitHub token expires in $DAYS_LEFT days."
