# CI: every pull request and every push to main (docs/technical/ci.md).
#
# checks      lint and unit tests, for quick feedback (no Docker)
# layers      every layer but performance and dashboard, through scripts/regression.py, the
#             same script as `make regression`
# dashboard   the dashboard layer, in two shards side by side (it takes most of the time)
# regression  the three parts' reports merged (regression.py --combine), then the
#             traceability check over all of them; the check a merge requires, so it runs,
#             and fails, when a part failed or never reported; reports kept as artifacts
#
# No secrets: tests use moto for R2, a local wrangler for the Worker and a fake USGS feed.
# Actions are pinned to commit SHAs (the tag is in the comment); the token is read-only.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON_DOWNLOADS: automatic
  FORCE_COLOR: "1"

jobs:
  checks:
    name: Lint and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: make install
      - run: make lint
      - run: make test

  layers:
    name: Regression layers (all but dashboard and performance)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      # The README's quick start, as a reviewer would run it on a fresh clone.
      - name: Configure from the example settings
        run: cp .env.example .env
      - run: make install
      - run: make up
      - name: Regression layers
        run: uv run python scripts/regression.py --skip performance dashboard
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: part-layers
          path: reports/
          retention-days: 30
      - name: Service logs, if anything failed
        if: failure()
        run: docker compose logs --no-color --tail 200 kafka postgres

  dashboard:
    name: Regression layers (dashboard, shard ${{ matrix.shard }} of 2)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Configure from the example settings
        run: cp .env.example .env
      - run: make install
      - name: Install the dashboard and its test browser
        run: |
          cd dashboard && npm ci
          cd .. && uv run playwright install --with-deps chromium
      - name: Fetch the DuckDB extensions the page serves
        run: uv run python scripts/fetch_duckdb_extensions.py
      - name: Dashboard layer
        env:
          SHARD: ${{ matrix.shard }}
        run: uv run python scripts/regression.py --only dashboard --shard "$SHARD/2"
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: part-dashboard-${{ matrix.shard }}
          path: reports/
          retention-days: 30

  regression:
    name: Regression (all layers but performance)
    needs: [layers, dashboard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: make install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: part-*
          path: parts/
      # A part that failed before writing its summary, or never ran, is reported as not run.
      - name: Merge the parts and check traceability
        run: uv run python scripts/regression.py --skip performance --combine parts/*/
      - name: Summary on the run page
        if: always()
        run: cat reports/regression-summary.md >> "$GITHUB_STEP_SUMMARY" || echo "no summary written" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regression-reports
          path: |
            reports/
            docs/progress/traceability-matrix.md
          retention-days: 30
