# CI: every pull request and every push to main (docs/technical/ci.md).
#
# checks      lint and unit tests, for quick feedback (no Docker)
# regression  every layer but performance through scripts/regression.py, the same script as
#             `make regression`, then the traceability check; reports kept as artifacts
#
# No secrets: tests use moto for R2, a local wrangler for the Worker and a fake USGS feed.
# Actions are pinned to commit SHAs (the tag is in the comment); the token is read-only.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON_DOWNLOADS: automatic
  FORCE_COLOR: "1"

jobs:
  checks:
    name: Lint and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: make install
      - run: make lint
      - run: make test

  regression:
    name: Regression (all layers but performance)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      # The README's quick start, as a reviewer would run it on a fresh clone.
      - name: Configure from the example settings
        run: cp .env.example .env
      - run: make install
      - name: Install the dashboard and its test browser
        run: |
          cd dashboard && npm ci
          cd .. && uv run playwright install --with-deps chromium
      - name: Fetch the DuckDB extensions the page serves
        run: uv run python scripts/fetch_duckdb_extensions.py
      - run: make up
      - name: Regression
        run: uv run python scripts/regression.py --skip performance
      - name: Summary on the run page
        if: always()
        run: cat reports/regression-summary.md >> "$GITHUB_STEP_SUMMARY" || echo "no summary written" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regression-reports
          path: |
            reports/
            docs/progress/traceability-matrix.md
          retention-days: 30
      - name: Service logs, if anything failed
        if: failure()
        run: docker compose logs --no-color --tail 200 kafka postgres
